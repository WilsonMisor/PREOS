name: Test Phase24-25 Resolver Windows

on:
  push:
    branches:
      - test/phase24-25-final-resolver-windows-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-windows-candidate:
    runs-on: windows-latest
    steps:
      - name: Preserve repository bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolver self-test
        run: python acceptance/phase24_25_resolver_r3.py --self-test
      - name: Windows transaction and rollback tests
        run: python acceptance/test_phase24_transaction_windows.py
      - name: Exact Windows candidate build
        env:
          CODEX_HOME: ${{ runner.temp }}\codex-home
        run: python acceptance/phase24_25_resolver_r3.py --candidate-only
