name: Validate PREOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate PREOS integrity and semantics
        run: python scripts/validate-preos.py
      - name: Run PREOS unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
