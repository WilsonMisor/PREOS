name: Validate PREOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-validation:
    name: platform-validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve repository bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate PREOS integrity and semantics
        run: python scripts/validate-preos.py
      - name: Run PREOS unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts

  validate:
    name: validate
    needs: platform-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform validation jobs to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform-validation.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Platform validation result: $PLATFORM_RESULT" >&2
            exit 1
          fi
          echo "All PREOS platform validation jobs passed."
